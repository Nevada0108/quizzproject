<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Quiz Game</title>
    <link rel="stylesheet" href="./dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1 class="logo">🎉 Quiz Game</h1>
            <div class="auth-section">
                <button class="login-btn" onclick="window.location.href='index.html'">Trang chủ</button>
                <button class="signup-btn" onclick="window.location.href='createquiz.html'">Tạo Quiz</button>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">✨ Quản lý Quiz ✨</h2>
        <div class="dashboard-content">
            <div class="search-filter mb-4">
                <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm quiz theo tiêu đề...">
                <select id="sortSelect" class="form-select mt-2">
                    <option value="title-asc">Sắp xếp: Tiêu đề (A-Z)</option>
                    <option value="title-desc">Sắp xếp: Tiêu đề (Z-A)</option>
                    <option value="questions-asc">Số câu hỏi (Tăng dần)</option>
                    <option value="questions-desc">Số câu hỏi (Giảm dần)</option>
                </select>
            </div>
            <div id="quizList" class="quiz-list">
                <!-- Danh sách quiz -->
            </div>
            <div class="pagination mt-4">
                <button id="prevPage" class="btn login-btn" disabled>Trang trước</button>
                <span id="pageInfo" class="mx-3"></span>
                <button id="nextPage" class="btn login-btn">Trang sau</button>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <div class="footer-content">
            <p>© 2025 Quiz Game. Tất cả quyền được bảo lưu.</p>
            <div class="footer-links">
                <a href="#">Giới thiệu</a>
                <a href="#">Liên hệ</a>
                <a href="#">Điều khoản</a>
            </div>
        </div>
    </footer>

    <!-- Modal để xem chi tiết quiz -->
    <div class="modal fade" id="quizDetailModal" tabindex="-1" aria-labelledby="quizDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="quizDetailModalLabel">Chi tiết Quiz</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="quizDetailContent">
                    <!-- Nội dung chi tiết quiz sẽ được thêm bằng JavaScript -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn signup-btn" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./dashboard.js"></script>
</body>
</html>
