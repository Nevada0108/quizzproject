<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa Quiz - Quiz Game</title>
    <link rel="stylesheet" href="./editquiz.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1 class="logo">🎉 Quiz Game</h1>
            <div class="auth-section">
                <button class="login-btn" onclick="window.location.href='dashboard.html'">Quay lại Dashboard</button>
            </div>
        </div>
    </header>

    <div class="container">
        <h2 class="section-title">✨ Chỉnh sửa Quiz ✨</h2>
        <form id="editQuizForm" class="topic-card p-4 mx-auto" style="max-width: 600px;">
            <div class="mb-3">
                <label for="quizTitleInput" class="form-label fw-bold">Tiêu đề Quiz:</label>
                <input type="text" class="form-control" id="quizTitleInput" placeholder="Nhập tiêu đề quiz" required>
            </div>
            <div class="mb-3">
                <label for="quizQuestions" class="form-label fw-bold">Số câu hỏi:</label>
                <input type="number" class="form-control" id="quizQuestions" min="1" max="50" placeholder="Nhập số câu hỏi" required>
            </div>
            <div id="questionContainer">
                <!-- Các câu hỏi sẽ được thêm bằng JavaScript -->
            </div>
            <div class="d-flex justify-content-between mt-4">
                <div>
                    <button type="button" class="btn login-btn" id="prevQuestion" disabled>Câu hỏi phía trước</button>
                    <button type="button" class="btn login-btn" id="nextQuestion">Câu hỏi tiếp theo</button>
                </div>
                <button type="submit" class="btn signup-btn">Lưu thay đổi</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./editquiz.js"></script>
</body>
</html>
